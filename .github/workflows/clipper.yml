name: GTA 6 Automated Clipper

on:
  schedule:
    
    - cron: "7,22,37,52 * * * *"
  # Allows manual one-click test runs from the GitHub Actions tab
  workflow_dispatch:

jobs:
  clip-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore processed-video history
        uses: actions/cache/restore@v4
        with:
          path: clipper_work/processed_videos.json
          key: gta6-clipper-processed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gta6-clipper-processed-v1-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for YouTube challenge solving
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "yt-dlp[default]" google-api-python-client google-auth-oauthlib requests boto3

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Run unattended GTA 6 clipping pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python gta6_clipper.py --auto

      - name: Save processed-video history
        if: always() && hashFiles('clipper_work/processed_videos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: clipper_work/processed_videos.json
          key: gta6-clipper-processed-v1-${{ github.run_id }}-${{ github.run_attempt }}
